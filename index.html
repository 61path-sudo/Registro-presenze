<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Registro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8A2434">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<title>Registro lezioni di pianoforte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9ECEF; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#1A2230; --muted:#5E6878; --line:#D3D8DF;
  --felt:#8A2434; --felt-ink:#FFFFFF; --ebony:#1C1F26; --ivory:#FBFBF9;
  --ok:#2E7A57; --ok-bg:#E2F1E9; --warn:#9A6411; --warn-bg:#F7EBD6; --bad:#A83434; --bad-bg:#F6E0E0;
  --me:#3A57A0; --me-bg:#E1E7F5; --move:#74479A; --move-bg:#EEE5F5; --rec:#1F7480; --rec-bg:#DDF0F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161C; --surface:#1D222B; --surface2:#252B35; --ink:#E9ECF1; --muted:#9AA3B2; --line:#343B47;
    --felt:#C8505F; --felt-ink:#FFFFFF; --ebony:#07080B; --ivory:#E8E8E4;
    --ok:#6FCB9C; --ok-bg:#1E3A2D; --warn:#E3B05C; --warn-bg:#3B2F1A; --bad:#EE8A8A; --bad-bg:#3E2223;
    --me:#93A9E8; --me-bg:#232E4A; --move:#C29BE6; --move-bg:#33263F; --rec:#7FD0DA; --rec-bg:#18363A;
  }
}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1D222B; --surface2:#252B35; --ink:#E9ECF1; --muted:#9AA3B2; --line:#343B47;
  --felt:#C8505F; --felt-ink:#FFFFFF; --ebony:#07080B; --ivory:#E8E8E4;
  --ok:#6FCB9C; --ok-bg:#1E3A2D; --warn:#E3B05C; --warn-bg:#3B2F1A; --bad:#EE8A8A; --bad-bg:#3E2223;
  --me:#93A9E8; --me-bg:#232E4A; --move:#C29BE6; --move-bg:#33263F; --rec:#7FD0DA; --rec-bg:#18363A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.6rem;line-height:1.15;margin:4px 0 2px}
h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.25rem;margin:22px 0 10px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sync{font-size:.78rem;color:var(--muted);white-space:nowrap}
.ver{font-family:Figtree,system-ui,sans-serif;font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 8px;vertical-align:middle;margin-left:6px;letter-spacing:.02em}
.yearbar{display:flex;align-items:center;gap:8px;margin-top:10px}
.yearbar label{font-size:.85rem;font-weight:600;color:var(--muted)}
.yearbar select{font-weight:700;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 30px 6px 12px;min-height:38px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.syncbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;min-height:36px}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--felt);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* keyboard week strip */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.weeknav .lbl{font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-weight:600}
.keys{position:relative;display:grid;grid-template-columns:repeat(7,1fr);background:var(--ebony);padding:10px 6px 6px;border-radius:12px 12px 8px 8px;gap:3px;box-shadow:inset 0 6px 0 var(--felt)}
.key{position:relative;background:var(--ivory);color:#1A2230;border:0;border-radius:0 0 7px 7px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 9px;box-shadow:inset 0 -5px 0 #D9D9D2;transition:transform .08s, box-shadow .08s}
.key .d{font-size:.72rem;color:#5E6878}
.key .n{font-weight:700;font-size:1.05rem}
.key .dots{display:flex;gap:3px;height:6px;margin-bottom:6px}
.key .dots i{width:6px;height:6px;border-radius:50%;background:#B6BBC4}
.key .dots i.todo{background:#C27A10}
.key .dots i.done{background:#2E7A57}
.key.sel{transform:translateY(2px);box-shadow:inset 0 -2px 0 #D9D9D2, inset 0 0 0 3px var(--felt);}
.key.today .n{color:#8A2434}
.black{position:absolute;top:10px;width:calc((100% - 12px)/7*0.55);height:52px;background:linear-gradient(#2A2E37,#0E1014);border-radius:0 0 4px 4px;pointer-events:none;z-index:2;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){.key{transition:none}}

.daytitle{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.daytitle h2{margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;text-align:left;width:100%}
.card .time{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px}
.card .main{flex:1;min-width:0}
.card .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-size:.82rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card.faded{opacity:.62}
.chip{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.c-presente{background:var(--ok-bg);color:var(--ok)}
.c-giust{background:var(--warn-bg);color:var(--warn)}
.c-ingiust{background:var(--bad-bg);color:var(--bad)}
.c-insegnante{background:var(--me-bg);color:var(--me)}
.c-spostata{background:var(--move-bg);color:var(--move)}
.c-recupero{background:var(--rec-bg);color:var(--rec)}
.c-chiuso{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.c-todo{background:transparent;color:var(--warn);border:1px dashed var(--warn)}
.quick{flex:none;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-size:1.1rem;color:var(--ok)}
.quick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.endrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.endrow .time{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;color:var(--ink)}
.endrow b{font-weight:600;color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--felt);color:var(--felt-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.addline{margin-top:12px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:.82rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--felt)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--felt);color:#fff;font-size:.68rem;border-radius:99px;padding:0 6px;min-width:18px;line-height:18px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:calc(24px + env(safe-area-inset-top,0px))}
body.locked{overflow:hidden}
button,input,select,textarea,a{touch-action:manipulation}
.field input,.field select{min-height:44px;min-width:0;-webkit-appearance:none;appearance:none;font-size:16px}
.field input[type=date],.field input[type=time]{display:block;text-align:left}
.sheet{background:var(--surface);width:100%;max-width:560px;margin-top:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet{position:relative}
.xbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-size:1.1rem;line-height:1}
.sheet h3{padding-right:44px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.3rem;margin:0}
.sheet .lead{color:var(--muted);margin:2px 0 14px;font-size:.92rem}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 10px;text-align:left;font-weight:600;font-size:.92rem;line-height:1.2}
.sbtn small{display:block;font-weight:400;color:var(--muted);font-size:.76rem;margin-top:2px}
.sbtn.on.k-presente{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.sbtn.on.k-giust{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.sbtn.on.k-ingiust{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.sbtn.on.k-insegnante{border-color:var(--me);background:var(--me-bg);color:var(--me)}
.sbtn.on.k-chiuso{border-color:var(--muted);background:var(--surface2);color:var(--ink)}
.sbtn.wide{grid-column:span 2}
.mtable{width:100%;border-collapse:collapse;font-size:.9rem}
.mtable th,.mtable td{padding:9px 6px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mtable th{font-size:.74rem;color:var(--muted);font-weight:600;border-top:0;vertical-align:bottom}
.mtable td:first-child,.mtable th:first-child{text-align:left}
.mtable td.big{font-weight:700;font-size:1.05rem}
.mtable tfoot td{font-weight:700;border-top:2px solid var(--line)}
.scrollx{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px}
.sb-seg{margin:14px 0 4px}
.sb-seg.seg{background:var(--surface)}
.sb-seg.seg button.on{background:var(--surface2)}
.sbtn small{color:inherit;opacity:.85}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:64px;resize:vertical;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sect{margin-top:16px}
.sect > .t{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.note{font-size:.85rem;color:var(--muted)}

/* recuperi & allievi */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.group .gname{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ritem:first-of-type{border-top:0}
.ritem .w{font-size:.92rem}
.ritem .w b{font-weight:600}
.ritem .w div{font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:4px 0}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.statbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.statbox div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.statbox b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.statbox span{font-size:.74rem;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:60;max-width:90%}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div class="in">
  <button data-tab="agenda" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button data-tab="recuperi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Recuperi<span class="badge hidden" id="recBadge"></span></button>
  <button data-tab="allievi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>Allievi</button>
</div></nav>
<div id="sheetRoot"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* ---------- utilities ---------- */
const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const DAYS_FULL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MONTHS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dow=s=>(parse(s).getDay()+6)%7;
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>addDays(s,-dow(s));
const mk=s=>s.slice(0,7);
const today=()=>iso(new Date());
const fmtLong=s=>{const d=parse(s);return DAYS_FULL[dow(s)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};
const fmtShort=s=>{const d=parse(s);return DAYS[dow(s)].toLowerCase()+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

const STATUS={
  presente:{label:'Presente',short:'Presente'},
  giust:{label:'Assente giustificato',short:'Ass. giustificata'},
  ingiust:{label:'Assente non giustificato',short:'Ass. non giustificata'},
  insegnante:{label:'Saltata per me',short:'Saltata per me'},
  spostata:{label:'Spostata',short:'Spostata'},
  chiuso:{label:'Chiuso (festività)',short:'Chiuso'}
};
const ABSENCES=['giust','ingiust','insegnante'];
const DEFAULT_REC={giust:'da',ingiust:'no',insegnante:'da'};

/* ---------- state ---------- */
let S={students:[],months:{}};
const VERSION='1.0';
/* school year: 1 September – 31 August, identified by its starting calendar year */
const yearOf=s=>{const [y,m]=s.split('-').map(Number);return m>=9?y:y-1};
const syStart=y=>y+'-09-01',syEnd=y=>(y+1)+'-08-31';
const syLabel=y=>pad(y%100)+'/'+pad((y+1)%100);
const inYear=(s,y)=>s>=syStart(y)&&s<=syEnd(y);
const ui={tab:'agenda',date:today(),allView:'elenco',month:mk(today()),year:yearOf(today())};
function setYear(y){ui.year=y;const t=today();
  if(inYear(t,y)){ui.date=t;ui.month=mk(t)}else{ui.date=syStart(y);ui.month=y+'-09'}}
function yearOptions(){
  let lo=yearOf(today()),hi=yearOf(today())+1;
  for(const s of S.students)for(const sl of s.slots)lo=Math.min(lo,yearOf(sl.from)),hi=Math.max(hi,yearOf(sl.from));
  lo=Math.min(lo,ui.year);hi=Math.max(hi,ui.year);const out=[];for(let y=hi;y>=lo;y--)out.push(y);return out;
}
function studentInYear(s,y){return s.slots.length&&s.slots[0].from<=syEnd(y)&&(!s.until||s.until>=syStart(y))}
const LS='pianoRegistro.v1';

function month(m){return S.months[m]||(S.months[m]={records:{},extras:[]})}
function slotAt(st,date){
  if(st.until&&date>st.until)return null;
  let cur=null;for(const sl of st.slots){if(sl.from<=date)cur=sl}
  return cur;
}
function student(id){return S.students.find(s=>s.id===id)}

/* A lesson is either a regular weekly slot (key "sid@date") or an extra (id "x...") */
function lessonsOn(date){
  const out=[];const m=month(mk(date));
  for(const st of S.students){
    const sl=slotAt(st,date);
    if(sl&&sl.day===dow(date)){
      const key=st.id+'@'+date;const r=m.records[key]||{};
      out.push({key,sid:st.id,date,time:sl.time,dur:sl.dur,kind:'regular',...r});
    }
  }
  for(const x of m.extras){if(x.date===date)out.push({...x,key:x.id})}
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function getLesson(key,date){return lessonsOn(date).find(l=>l.key===key)}
function setLesson(key,date,patch){
  const m=month(mk(date));
  if(key.startsWith('x')){const x=m.extras.find(e=>e.id===key);Object.assign(x,patch);for(const k in patch)if(patch[k]===undefined)delete x[k]}
  else{const r=m.records[key]||(m.records[key]={});Object.assign(r,patch);for(const k in patch)if(patch[k]===undefined)delete r[k];if(!Object.keys(r).length)delete m.records[key]}
  markDirty(mk(date));
}
function allExtras(){const a=[];for(const m in S.months)for(const x of S.months[m].extras)a.push(x);return a}
function removeExtra(id,date){const m=month(mk(date));m.extras=m.extras.filter(e=>e.id!==id);markDirty(mk(date))}
function addExtra(x){month(mk(x.date)).extras.push(x);markDirty(mk(x.date))}

/* all lessons of a student up to a date */
function studentLessons(sid,upTo){
  const st=student(sid);if(!st||!st.slots.length)return[];
  const out=[];let d=st.slots[0].from;
  while(d<=upTo){
    const sl=slotAt(st,d);
    if(sl&&sl.day===dow(d)){const key=sid+'@'+d;const r=month(mk(d)).records[key]||{};out.push({key,sid,date:d,time:sl.time,kind:'regular',...r})}
    d=addDays(d,1);
    if(st.until&&d>st.until)break;
  }
  for(const x of allExtras())if(x.sid===sid&&x.date<=upTo)out.push({...x,key:x.id});
  return out.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
}

/* end of the teaching day: latest finish among lessons that actually take place */
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const toTime=n=>pad(Math.floor(n/60)%24)+':'+pad(n%60);
function durOf(l){if(l.dur)return +l.dur;const st=student(l.sid);const sl=st&&(slotAt(st,l.date)||st.slots[st.slots.length-1]);return sl&&sl.dur?+sl.dur:45}
function endOfDay(ls){let e=null,who=null;for(const l of ls){if(l.status==='spostata'||!student(l.sid))continue;const f=toMin(l.time)+durOf(l);if(e===null||f>e){e=f;who=l}}return e===null?null:{time:toTime(e),who}}

/* make-up tracking */
function recoveryState(l){
  if(!ABSENCES.includes(l.status)||l.recupero!=='da')return null;
  const linked=allExtras().filter(x=>x.kind==='recupero'&&x.ref===l.key).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(linked.some(x=>x.status==='presente'))return{state:'fatto',x:linked.find(x=>x.status==='presente')};
  const planned=linked.find(x=>!x.status);
  if(planned)return{state:'fissato',x:planned};
  return{state:'da'};
}
function pendingRecoveries(){
  const out=[];const t=today();
  for(const st of S.students){
    for(const l of studentLessons(st.id,addDays(t,400))){
      const r=recoveryState(l);if(r&&r.state!=='fatto')out.push({l,r});
    }
  }
  return out;
}

/* ---------- persistence: this device + a file in a private GitHub repository ---------- */
const CFG_KEY='pianoRegistro.github',FILE='registro.json';
let cfg=null;try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){}
let remoteSha=null,saving=false,saveTimer=null,editVersion=0,pending=false;
try{pending=localStorage.getItem(LS+'.pending')==='1'}catch(e){}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function setPending(v){pending=v;lsSet(LS+'.pending',v?'1':'0')}
function saveLocal(){lsSet(LS,JSON.stringify(S))}
function loadLocal(){try{const v=lsGet(LS);if(v){const p=JSON.parse(v);if(p&&p.students)S=normalize(p)}}catch(e){}}
function normalize(o){return{students:Array.isArray(o.students)?o.students:[],months:o.months&&typeof o.months==='object'?o.months:{}}}
function payload(){return{app:'registro-pianoforte',version:1,updated:new Date().toISOString(),students:S.students,months:S.months}}
function markDirty(){editVersion++;saveLocal();setPending(true);if(cfg){setSync('Da sincronizzare');clearTimeout(saveTimer);saveTimer=setTimeout(push,2500)}}
function setSync(t){ui.sync=t;const el=document.getElementById('sync');if(el)el.textContent=t}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){const s=atob(b.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)))}
function ghFetch(path,opt={},c=cfg){
  return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+path,{cache:'no-store',...opt,
    headers:{'Authorization':'Bearer '+c.token,'Accept':opt.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
}
async function ghErr(r){
  let msg='';try{msg=(await r.json()).message||''}catch(e){}
  if(r.status===401)return{auth:true,message:'Il codice di accesso non è valido o è scaduto.'};
  if(r.status===403)return{auth:/permission|resource not accessible/i.test(msg),message:/rate limit/i.test(msg)?'Troppe richieste a GitHub, riprovo tra poco.':'Il codice di accesso non ha il permesso di scrivere nel repository (serve “Contents: Read and write”).'};
  if(r.status===404)return{auth:true,message:'Repository non trovato: controlla nome utente e nome del repository, e che il codice abbia accesso a quel repository.'};
  return{message:'GitHub ha risposto con un errore ('+r.status+(msg?': '+msg:'')+').'};
}
async function pull(){
  const r=await ghFetch('/contents/'+FILE);
  if(r.status===404){remoteSha=null;return null}
  if(!r.ok)throw await ghErr(r);
  const j=await r.json();remoteSha=j.sha;
  let txt=j.content&&j.encoding==='base64'?b64dec(j.content):'';
  if(!txt&&j.size>0){const r2=await ghFetch('/contents/'+FILE,{accept:'application/vnd.github.raw'});if(!r2.ok)throw await ghErr(r2);txt=await r2.text()}
  return txt?normalize(JSON.parse(txt)):normalize({});
}
/* combine two copies; on the same item this device wins */
function merge(rem,loc){
  const out={students:rem.students.slice(),months:JSON.parse(JSON.stringify(rem.months))};
  for(const s of loc.students){const i=out.students.findIndex(x=>x.id===s.id);if(i>=0)out.students[i]=s;else out.students.push(s)}
  for(const m in loc.months){const T=out.months[m]||(out.months[m]={records:{},extras:[]});const L=loc.months[m];
    Object.assign(T.records,L.records);for(const x of L.extras){const i=T.extras.findIndex(e=>e.id===x.id);if(i>=0)T.extras[i]=x;else T.extras.push(x)}}
  return out;
}
async function push(){
  if(!cfg||!pending)return;
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(push,1500);return}
  if(!navigator.onLine){setSync('Offline, sincronizzo dopo');return}
  saving=true;setSync('Sincronizzazione…');const v=editVersion;let ok=false;
  try{
    for(let i=0;i<3&&!ok;i++){
      const body={message:'Registro aggiornato '+new Date().toLocaleString('it-IT'),content:b64enc(JSON.stringify(payload()))};
      if(remoteSha)body.sha=remoteSha;
      const r=await ghFetch('/contents/'+FILE,{method:'PUT',body:JSON.stringify(body)});
      if(r.ok){const j=await r.json();remoteSha=j.content.sha;lsSet(LS+'.sha',remoteSha);ok=true;break}
      if(r.status===409||r.status===422){const rem=await pull();if(rem){S=merge(rem,S);saveLocal();if(!root.innerHTML)render()}continue}
      throw await ghErr(r);
    }
    if(ok){if(v===editVersion)setPending(false);setSync(pending?'Da sincronizzare':'Sincronizzato')}
    else setSync('Non sincronizzato');
  }catch(e){setSync(e.auth?'Accesso GitHub da sistemare':'Non sincronizzato');if(e.auth||e.message)toast(e.message||'Sincronizzazione non riuscita')}
  saving=false;
  if(ok&&pending){clearTimeout(saveTimer);saveTimer=setTimeout(push,1500)}
}
async function sync(){
  if(!cfg){setSync('Solo su questo dispositivo');return}
  if(saving)return;
  if(!navigator.onLine){setSync(pending?'Offline, sincronizzo dopo':'Offline');return}
  setSync('Sincronizzazione…');
  try{
    const rem=await pull();const last=lsGet(LS+'.sha');
    if(!rem){setPending(true);await push();return}
    if(pending){if(remoteSha!==last)S=merge(rem,S);saveLocal();if(!root.innerHTML)render();await push()}
    else{if(remoteSha!==last){S=rem;saveLocal();if(!root.innerHTML)render()}lsSet(LS+'.sha',remoteSha);setSync('Sincronizzato')}
  }catch(e){setSync(e.auth?'Accesso GitHub da sistemare':'Non sincronizzato');if(e.message)toast(e.message)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();else if(pending)push()});
window.addEventListener('online',()=>sync());
window.addEventListener('pagehide',()=>{if(pending&&cfg&&!saving)push()});

}
function chipFor(l){
  const t=today();
  if(l.status==='spostata')return `<span class="chip c-spostata">Spostata</span>`;
  if(l.status){
    let s=`<span class="chip c-${l.status}">${STATUS[l.status].short}</span>`;
    if(ABSENCES.includes(l.status)){
      const r=recoveryState(l);
      if(r)s+=` <span class="chip c-recupero">${r.state==='fatto'?'Recuperata':r.state==='fissato'?'Recupero '+fmtShort(r.x.date):'Da recuperare'}</span>`;
    }

function kindNote(l){
  if(l.kind==='recupero'){const o=l.refDate?fmtShort(l.refDate):'';return `<span class="chip c-recupero">Recupero${o?' del '+o:''}</span>`}

  if(l.kind==='extra')return `<span class="chip">Lezione extra</span>`;
  if(l.status==='spostata'&&l.movedTo){const x=allExtras().find(e=>e.id===l.movedTo);if(x)return `<span>→ ${fmtShort(x.date)} alle ${x.time}</span>`}

}
function renderAgenda(){

    </div>`}).join(''):`<div class="empty">${S.students.length?'Nessuna lezione in questo giorno.':'Aggiungi i tuoi allievi con il loro giorno e orario fisso: le lezioni compariranno qui ogni settimana.'}</div>`;

function yearLessons(sid,y){const end=syEnd(y)<today()?syEnd(y):today();return studentLessons(sid,end).filter(l=>l.date>=syStart(y))}

function daysOfMonth(m){const out=[];let d=m+'-01';while(mk(d)===m){out.push(d);d=addDays(d,1)}return out}

  <button class="btn ghost" type="button" data-close="1">${isNew?'Annulla':'Chiudi'}</button></div></form>

    }catch(e){err('Non sono riuscito a salvare: '+(e&&e.message?e.message:e)+'. Riprova; se succede ancora, dimmi questo messaggio.')}};
    sh.querySelector('#sf').addEventListener('submit',e=>{e.preventDefault();save()});
    sh.querySelector('#sv').addEventListener('click',e=>{e.preventDefault();save()});
    sh.querySelector('#nm').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});

        if(ch)markDirty(m)}
      markDirty('students');closeSheet();toast('Allievo eliminato');
    };
  });
}

async function shareOrDownload(filename,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const f=new File([blob],filename,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function saveCSV(rows,filename){
  const csv='\ufeff'+rows.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');
  shareOrDownload(filename,csv,'text/csv');
}

  }catch(e){toast('Questo file non è un backup del registro.')}};rd.readAsText(file);
}

  const kinds={regular:'Ordinaria',recupero:'Recupero',spostata:'Spostata',extra:'Extra'};
  const all=[];for(const s of S.students)for(const l of yearLessons(s.id,ui.year))all.push([l,s]);
  all.sort((a,b)=>(a[0].date+a[0].time).localeCompare(b[0].date+b[0].time));
  for(const [l,s] of all){const r=recoveryState(l);
    rows.push([l.date,l.time,s.name,kinds[l.kind]||'',l.status?STATUS[l.status].label:'',r?(r.state==='fatto'?'Recuperata':r.state==='fissato'?'Fissato':'Da recuperare'):(ABSENCES.includes(l.status)?'No':''),l.note||''])}
  saveCSV(rows,'registro-lezioni-'+syLabel(ui.year).replace('/','-')+'.csv');
}

/* ---------- events ---------- */
document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='ysel'){setYear(+e.target.value);render();window.scrollTo(0,0)}});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2200)}
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;ui.tab=b.dataset.tab;render();window.scrollTo(0,0)});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.day){ui.date=d.day;ui.year=yearOf(d.day);render()}
  else if(d.week){ui.date=addDays(ui.date,+d.week);ui.year=yearOf(ui.date);render()}
  else if(d.goto){ui.date=d.goto;ui.year=yearOf(d.goto);ui.tab='agenda';render();window.scrollTo(0,0)}
  else if(d.open)lessonSheet(d.open,ui.date);
  else if(d.quick){const l=getLesson(d.quick,ui.date);setLesson(d.quick,ui.date,l.status==='presente'?{status:undefined}:{status:'presente',recupero:undefined});render()}
  else if(d.plan)planSheet(d.plan,d.date);
  else if(d.norec){setLesson(d.norec,d.date,{recupero:'no'});render();toast('Segnata come non da recuperare')}
  else if(d.student)studentSheet(d.student);
  else if(d.act==='newStudent')studentSheet(null);
  else if(d.act==='addLesson')addLessonSheet();
  else if(d.act==='export')exportCSV();
  else if(d.act==='backup')exportBackup();
  else if(d.act==='settings')settingsSheet();
  else if(d.act==='hideBanner'){lsSet(LS+'.nobanner','1');render()}
  else if(d.act==='exportMonth')exportMonth();
  else if(d.act==='closure')closureSheet();
  else if(d.allview){ui.allView=d.allview;render()}
  else if(d.mon){const [y,m]=ui.month.split('-').map(Number);const dt=new Date(y,m-1+(+d.mon),1);ui.month=dt.getFullYear()+'-'+pad(dt.getMonth()+1);ui.year=yearOf(ui.month+'-01');render()}
});

loadLocal();ui.sync=cfg?'Sincronizzazione…':'Solo su questo dispositivo';render();sync();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
